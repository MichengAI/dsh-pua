name: Check

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      full:
        description: Run the full check suite
        type: boolean
        default: true
  workflow_call:
    inputs:
      full:
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  changes:
    name: Change scope
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      run_tests: ${{ steps.scope.outputs.run_tests }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: scope
        uses: actions/github-script@v8
        with:
          script: |
            // Manual invocations and publish calls always run the full check; ordinary pushes only skip presentation docs.
            if (${{ inputs.full == true }}) {
              core.setOutput('run_tests', 'true');
              return;
            }
            const base = context.eventName === 'pull_request'
              ? context.payload.pull_request.base.sha : context.payload.before;
            if (!base || /^0+$/.test(base) || context.ref.startsWith('refs/tags/')) {
              core.setOutput('run_tests', 'true');
              return;
            }
            const { execFileSync } = require('node:child_process');
            const files = execFileSync('git', ['diff', '--no-renames', '--name-only', '-z', base, 'HEAD'], { encoding: 'utf8' }).split('\0').filter(Boolean);
            const presentation = /^(?:README(?:\.[^/]+)?\.md|CHANGELOG(?:\.[^/]+)?\.md|docs\/.*|assets\/(?:branding|screenshots)\/.*)$/;
            const run = files.some(file => !presentation.test(file));
            core.setOutput('run_tests', String(run));
            core.info(run ? 'Running full check' : 'Only docs or presentation images changed; skipping full tests');

  check:
    needs: changes
    if: needs.changes.outputs.run_tests == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.19.0'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run check
      - run: npm pack --dry-run

  compatibility:
    needs: changes
    if: needs.changes.outputs.run_tests == 'true'
    strategy:
      fail-fast: false
      matrix:
        version: ['0.2.0-rc.1', '0.2.0-rc.2', '0.2.1-rc.1', '0.2.1-rc.2']
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.19.0'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run build
      - run: npm run test:compat -- ${{ matrix.version }}
